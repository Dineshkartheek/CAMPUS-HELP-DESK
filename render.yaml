services:
  - type: web
    name: campuscare-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://campus-help-desk-git-main-dineshkartheekvajrapu-6901.vercel.app
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: COOKIE_SECURE
        value: "true"
